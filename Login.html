        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

    background:linear-gradient(135deg,#141e30,#243b55);
}

.container{
    width:420px;
    background:#ffffff;
    border-radius:20px;
    padding:35px 30px;
    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.35);

    transition:.3s;
}

.container:hover{
    transform:translateY(-5px);
}

.logo{
    width:80px;
    height:70px;
    object-fit:contain;
    margin-bottom:10px;
}

h3{
    color:#e50914;
    font-size:28px;
    margin-bottom:10px;
}

h1{
    font-size:30px;
    color:#222;
    margin-bottom:10px;
}

.info{
    color:#666;
    margin-bottom:30px;
    font-size:16px;
}

/* Buttons */

.btn{
    width:100%;
    padding:14px;

    margin:12px 0;

    border:none;
    border-radius:30px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.app{
    background:#e50914;
    color:white;
}

.app:hover{
    background:#b20710;
    transform:translateY(-2px);
}

.email{
    background:#f2f2f2;
    color:#222;
}

.email:hover{
    background:#e5e5e5;
}

.google{
    background:#fff;
    border:1px solid #ddd;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#222;
}

.google:hover{
    background:#fafafa;
}

.google-icon{
    width:24px;
    margin-right:12px;
}

/* Login button link */

.app a{
    color:white;
    text-decoration:none;
    display:block;
}

/* Sign up */

.already{
    margin-top:18px;
    font-size:15px;
    color:#555;
}

.already a{
    color:#e50914;
    text-decoration:none;
    font-weight:bold;
}

.already a:hover{
    text-decoration:underline;
}

/* Terms */

.priyans{
    margin-top:25px;
    font-size:13px;
    color:#777;
    line-height:1.7;
}

.priyans a{
    color:#222;
    font-weight:bold;
    text-decoration:none;
}

.priyans a:hover{
    color:#e50914;
}

/* Responsive */

@media(max-width:500px){

    .container{
        width:90%;
        padding:25px;
    }

    h1{
        font-size:24px;
    }
}
